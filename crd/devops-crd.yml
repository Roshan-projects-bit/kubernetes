kind: CustomResourceDefinition
apiVersion: apiextensions.k8s.io/v1
metadata:
  name: devopsbatches.roshan.com
spec:
  group: roshan.com
  names:
    plural: devopsbatches
    singular: devopsbatch
    kind: DevopsBatch
    shortNames:
      - rld
      - dob
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                  description: this is name for dob
                duration:
                  type: string
                  description: this is duration for dob
                mode:
                  type: string
                  description: this is mode for dob
                platform:
                  type: string
                  description: this is platform for dob
      
